name: Playwright BDD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# Memberikan izin token GitHub untuk menulis ke GitHub Pages
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAUCE_DEMO_BASE_URL: ${{ secrets.SAUCE_DEMO_BASE_URL }}
      SAUCE_DEMO_STANDARD_USERNAME: ${{ secrets.SAUCE_DEMO_STANDARD_USERNAME }}
      SAUCE_DEMO_LOCKED_OUT_USERNAME: ${{ secrets.SAUCE_DEMO_LOCKED_OUT_USERNAME }}
      SAUCE_DEMO_PROBLEM_USERNAME: ${{ secrets.SAUCE_DEMO_PROBLEM_USERNAME }}
      SAUCE_DEMO_PERFORMANCE_GLITCH_USERNAME: ${{ secrets.SAUCE_DEMO_PERFORMANCE_GLITCH_USERNAME }}
      SAUCE_DEMO_PASSWORD: ${{ secrets.SAUCE_DEMO_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Run Playwright BDD tests
        run: npm test

      - name: Upload Playwright HTML report (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: error

      - name: Upload Allure report (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error

      - name: Upload raw test results (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            allure-results
          if-no-files-found: error

      # STEP BARU: Gabungkan kedua report ke satu folder khusus sebelum di-deploy
      - name: Combine Reports for Deployment
        if: always()
        run: |
          mkdir -p public-reports
          if [ -d "playwright-report" ]; then cp -r playwright-report public-reports/playwright; fi
          if [ -d "allure-report" ]; then cp -r allure-report public-reports/allure; fi

      # STEP UPDATE: Deploy folder gabungan ke GitHub Pages
      - name: Deploy All Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'